<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Draft Calcetto 5v5 - Extreme Edition</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Rajdhani:wght@600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #08080a;
      --panel-bg: rgba(15, 15, 20, 0.95);
      --neon-green: #00ff66;
      --neon-red: #ff0055;
      --neon-gold: #ffb700;
      --neon-blue: #00e5ff;
      --text-main: #ffffff;
      --text-muted: #9494a0;
      --border-glow: rgba(0, 255, 102, 0.4);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.12), transparent 70%),
        radial-gradient(circle at 50% 100%, rgba(255, 0, 85, 0.1), transparent 70%);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    h1, h2, h3 {
      font-family: 'Teko', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0;
      line-height: 0.9;
    }

    .main-title {
      font-size: 2.8rem;
      text-shadow: 0 0 10px var(--neon-green), 0 0 25px rgba(0,255,102,0.3);
      color: #fff;
      text-align: center;
      margin: 15px 0 2px 0;
    }

    .sub-title {
      font-size: 1.1rem;
      color: var(--neon-gold);
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 15px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 40px;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
      border-radius: 12px 12px 0 0;
    }

    /* PULSANTI CATTIVI */
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #1a1a24, #121218);
      border: 2px solid var(--neon-green);
      color: var(--neon-green);
      font-family: 'Teko', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 2px;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
      margin-bottom: 10px;
      text-align: center;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-red {
      border-color: var(--neon-red);
      color: var(--neon-red);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
    }

    .btn-gold {
      border-color: var(--neon-gold);
      color: var(--neon-gold);
      box-shadow: 0 0 10px rgba(255, 183, 0, 0.2);
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 1.1rem;
      width: auto;
      display: inline-block;
    }

    /* CARD GIOCATORE */
    .player-card {
      background: linear-gradient(145deg, #161622, #0d0d12);
      border: 2px solid var(--neon-blue);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      position: relative;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
    }

    .player-card.bidone {
      border-color: var(--neon-red);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
    }

    .player-card.legenda {
      border-color: var(--neon-gold);
      box-shadow: 0 0 20px rgba(255, 183, 0, 0.3);
    }

    .player-overall {
      position: absolute;
      top: 10px;
      right: 12px;
      font-family: 'Teko', sans-serif;
      font-size: 1.8rem;
      color: var(--neon-gold);
      line-height: 1;
    }

    .player-name {
      font-family: 'Teko', sans-serif;
      font-size: 2rem;
      margin: 5px 0 0 0;
      color: #fff;
    }

    .player-role {
      font-size: 0.9rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .player-desc {
      font-size: 0.85rem;
      color: var(--neon-red);
      margin-top: 5px;
      font-style: italic;
    }

    /* INPUT E FORM */
    input {
      width: 100%;
      background: #0f0f14;
      border: 1px solid #333;
      padding: 12px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.1rem;
      border-radius: 8px;
      margin-bottom: 10px;
      text-align: center;
      outline: none;
    }

    input:focus {
      border-color: var(--neon-green);
      box-shadow: 0 0 8px rgba(0,255,102,0.3);
    }

    .hidden {
      display: none !important;
    }

    .flex-row {
      display: flex;
      gap: 10px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #121218;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 1rem;
      border-left: 3px solid var(--neon-green);
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1 class="main-title">DRAFT CALCETTO</h1>
    <div class="sub-title">5v5 STREET BATTLE</div>

    <!-- MENU PRINCIPALE -->
    <div id="menu-screen" class="panel">
      <button class="btn" onclick="startLocalGame()">🎮 Partita Locale (Offline)</button>
      <button class="btn btn-gold" onclick="showOnlineMenu()">🌐 Partita Online (Firebase)</button>
    </div>

    <!-- MENU ONLINE -->
    <div id="online-menu-screen" class="panel hidden">
      <h3 style="color:var(--neon-gold); font-size:1.5rem; margin-bottom:10px;">Modalità Online</h3>
      <input type="text" id="room-code-input" placeholder="INSERISCI CODICE STANZA (es. AB12)" maxlength="4" style="text-transform:uppercase;">
      <button class="btn" onclick="joinRoom()">Entra nella Stanza</button>
      <button class="btn btn-gold" onclick="createRoom()">Crea Nuova Stanza</button>
      <button class="btn btn-red" onclick="showMainScreen()">Indietro</button>
    </div>

    <!-- SCHERMATA DRAFT / GIOCO -->
    <div id="game-screen" class="panel hidden">
      <div class="status-bar">
        <span id="turn-indicator">TURNO: GIOCATORE 1</span>
        <button class="btn btn-red btn-small" onclick="confirmExit()">🏠 ESCI</button>
      </div>

      <div id="draft-container">
        <!-- Qui apparirà il giocatore da scegliere -->
      </div>
    </div>

    <!-- SCHERMATA RIEPILOGO OVERALL PRIMA DEL MATCH -->
    <div id="summary-screen" class="panel hidden" style="text-align: center;">
      <h2 style="font-size: 2.2rem; color: var(--neon-gold);">CONFRONTO SQUADRE</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 15px;">Somma Overall dei 5 titolari in campo:</p>
      
      <div style="display: flex; justify-content: space-around; margin-bottom: 20px;">
        <div style="background: rgba(0,229,255,0.05); border: 1px solid var(--neon-blue); padding: 10px; border-radius: 8px; width: 45%;">
          <h3 style="color: var(--neon-blue); font-size: 1.4rem;" id="sum-name-1">Squadra 1</h3>
          <div id="sum-score-1" style="font-family: 'Teko'; font-size: 2.8rem; color: #fff;">0</div>
        </div>
        <div style="background: rgba(255,0,85,0.05); border: 1px solid var(--neon-red); padding: 10px; border-radius: 8px; width: 45%;">
          <h3 style="color: var(--neon-red); font-size: 1.4rem;" id="sum-name-2">Squadra 2</h3>
          <div id="sum-score-2" style="font-family: 'Teko'; font-size: 2.8rem; color: #fff;">0</div>
        </div>
      </div>

      <div id="favorite-text" style="font-family: 'Teko'; font-size: 1.5rem; color: var(--neon-gold); margin-bottom: 15px;"></div>
      <button class="btn" onclick="runMatchSimulation()">Fischio d'Inizio: Simula Partita! ⚽</button>
    </div>

    <!-- SCHERMATA RISULTATO PARTITA -->
    <div id="result-screen" class="panel hidden" style="text-align: center;">
      <h2 style="font-size: 2.5rem; color: var(--neon-green);" id="match-winner-title">VITTORIA!</h2>
      <div id="match-score-display" style="font-family: 'Teko'; font-size: 4rem; color: var(--neon-gold); margin: 10px 0;">3 - 2</div>
      <p id="match-details-text" style="color: var(--text-muted); margin-bottom: 20px;"></p>
      <button class="btn" onclick="showMainScreen()">Torna al Menu Principale</button>
    </div>
  </div>

  <script>
    // CONFIGURAZIONE FIREBASE (URL PERSONALE)
    const firebaseConfig = {
      databaseURL: "https://draftcalcettoonline-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    } else {
      firebase.app();
    }
    const db = firebase.database();

    // DATABASE GIGANTE POTENZIATO: Campioni, Leggende e i mitici Bidoni!
    const masterDatabase = [
      // TOP ATTUALI E LEGGENDE
      { name: "CR7 (Prime)", role: "Attaccante", ovr: 96, type: "legenda", desc: "La macchina da gol perfetta." },
      { name: "Messi (Prime)", role: "Attaccante", ovr: 97, type: "legenda", desc: "Il genio assoluto del pallone." },
      { name: "Ronaldo Fenomeno", role: "Attaccante", ovr: 98, type: "legenda", desc: "Fenomenale e inarrestabile." },
      { name: "Zidane", role: "Centrocampista", ovr: 95, type: "legenda", desc: "Classe pura e giocate di velluto." },
      { name: "Ronaldinho", role: "Attaccante", ovr: 95, type: "legenda", desc: "Magia pura e sorriso in campo." },
      { name: "Haaland", role: "Attaccante", ovr: 93, type: "normal", desc: "Un cyborg implacabile sotto porta." },
      { name: "Mbappé", role: "Attaccante", ovr: 94, type: "normal", desc: "Velocità supersonica." },
      { name: "De Bruyne", role: "Centrocampista", ovr: 92, type: "normal", desc: "Visione di gioco laser." },
      { name: "Bellingham", role: "Centrocampista", ovr: 91, type: "normal", desc: "Incursore totale ovunque." },
      { name: "Van Dijk", role: "Difensore", ovr: 90, type: "normal", desc: "Un muro invalicabile dietro." },
      { name: "Courtois", role: "Portiere", ovr: 90, type: "normal", desc: "Sanguigno e saracinesca." },
      { name: "Lautaro Martinez", role: "Attaccante", ovr: 89, type: "normal", desc: "Toro scatenato in area." },
      { name: "Barella", role: "Centrocampista", ovr: 88, type: "normal", desc: "Polmoni infiniti e grinta." },
      { name: "Theo Hernandez", role: "Difensore", ovr: 87, type: "normal", desc: "Freccia mancina devastante." },

      // I MITICI BIDONI / METEORE (Rischiosissimi ma esilaranti)
      { name: "Lord Bendtner", role: "Attaccante", ovr: 62, type: "bidone", desc: "Si credeva il migliore al mondo." },
      { name: "Gabigol", role: "Attaccante", ovr: 65, type: "bidone", desc: "Più festeggiamenti che gol." },
      { name: "Amauri", role: "Attaccante", ovr: 68, type: "bidone", desc: "Un autentico corpo estraneo." },
      { name: "Taider", role: "Centrocampista", ovr: 60, type: "bidone", desc: "Correva tanto ma a vuoto." },
      { name: "Jonathan (Il Fenomeno)", role: "Difensore", ovr: 64, type: "bidone", desc: "Soprannominato per ironia." },
      { name: "Djibril Cissé", role: "Attaccante", ovr: 67, type: "bidone", desc: "Più tagli di capelli che reti." },
      { name: "Bruno Peres", role: "Difensore", ovr: 63, type: "bidone", desc: "Celebre per il palo contro il Barca." }
    ];

    let gameState = {
      mode: 'local', // 'local' o 'online'
      roomCode: '',
      playerTurn: 1, // 1 o 2
      currentPool: [],
      draftStep: 0,
      team1: [],
      team2: []
    };

    function showMainScreen() {
      document.getElementById('menu-screen').classList.remove('hidden');
      document.getElementById('online-menu-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('summary-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
    }

    function showOnlineMenu() {
      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('online-menu-screen').classList.remove('hidden');
    }

    function confirmExit() {
      if (confirm("Vuoi davvero abbandonare la partita e tornare al menu?")) {
        showMainScreen();
      }
    }

    // AVVIO PARTITA LOCALE
    function startLocalGame() {
      gameState.mode = 'local';
      gameState.team1 = [];
      gameState.team2 = [];
      gameState.draftStep = 0;
      gameState.playerTurn = 1;

      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      prepareNextDraftPick();
    }

    // GENERAZIONE CASUALE GIOCATORI PER L'ASTA
    function prepareNextDraftPick() {
      if (gameState.draftStep >= 10) {
        // Finito il draft (5 a testa), mostra il riepilogo overall!
        showSummaryScreen();
        return;
      }

      // Mescola il database e prende 3 giocatori casuali tra cui scegliere
      let shuffled = [...masterDatabase].sort(() => 0.5 - Math.random());
      gameState.currentPool = shuffled.slice(0, 3);

      renderDraftUI();
    }

    function renderDraftUI() {
      const container = document.getElementById('draft-container');
      const turnText = document.getElementById('turn-indicator');
      
      let currentTeamName = gameState.playerTurn === 1 ? "GIOCATORE 1" : "GIOCATORE 2";
      turnText.innerText = `TURNO: ${currentTeamName} (Scelta ${Math.floor(gameState.draftStep/2) + 1}/5)`;

      let html = `<h3 style="text-align:center; margin-bottom:10px; color:var(--neon-gold);">SELEZIONA UN GIOCATORE</h3>`;
      
      gameState.currentPool.forEach((p, index) => {
        let cardClass = "player-card";
        if (p.type === 'bidone') cardClass += " bidone";
        if (p.type === 'legenda') cardClass += " legenda";

        html += `
          <div class="${cardClass}" style="margin-bottom: 12px; cursor: pointer;" onclick="selectPlayer(${index})">
            <div class="player-overall">${p.ovr}</div>
            <div class="player-name">${p.name}</div>
            <div class="player-role">${p.role}</div>
            <div class="player-desc">${p.desc}</div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function selectPlayer(index) {
      let chosenPlayer = gameState.currentPool[index];

      if (gameState.playerTurn === 1) {
        gameState.team1.push(chosenPlayer);
        gameState.playerTurn = 2;
      } else {
        gameState.team2.push(chosenPlayer);
        gameState.playerTurn = 1;
      }

      gameState.draftStep++;
      prepareNextDraftPick();
    }

    // SCHERMATA RIEPILOGO OVERALL
    function showSummaryScreen() {
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('summary-screen').classList.remove('hidden');

      let sum1 = gameState.team1.reduce((acc, p) => acc + p.ovr, 0);
      let sum2 = gameState.team2.reduce((acc, p) => acc + p.ovr, 0);

      document.getElementById('sum-score-1').innerText = sum1;
      document.getElementById('sum-score-2').innerText = sum2;

      let favText = "";
      if (sum1 > sum2) {
        favText = "🔥 Giocatore 1 parte leggermente favorito!";
      } else if (sum2 > sum1) {
        favText = "🔥 Giocatore 2 parte leggermente favorito!";
      } else {
        favText = "⚖️ Squadre perfettamente bilanciate sulla carta!";
      }
      document.getElementById('favorite-text').innerText = favText;
    }

    // SIMULAZIONE PARTITA E RISULTATO
    function runMatchSimulation() {
      let sum1 = gameState.team1.reduce((acc, p) => acc + p.ovr, 0);
      let sum2 = gameState.team2.reduce((acc, p) => acc + p.ovr, 0);

      // Calcolo gol influenzato dagli overall con un pizzico di casualità calcistica
      let base1 = Math.floor(sum1 / 90);
      let base2 = Math.floor(sum2 / 90);

      let goals1 = Math.max(0, base1 - 3 + Math.floor(Math.random() * 4));
      let goals2 = Math.max(0, base2 - 3 + Math.floor(Math.random() * 4));

      // Se c'è parità, aggiungiamo pathos
      if (goals1 === goals2) {
        if (Math.random() > 0.5) goals1++;
        else goals2++;
      }

      document.getElementById('summary-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      document.getElementById('match-score-display').innerText = `${goals1} - ${goals2}`;
      
      let winnerTitle = "";
      if (goals1 > goals2) {
        winnerTitle = "🏆 VITTORIA DEL GIOCATORE 1!";
      } else {
        winnerTitle = "🏆 VITTORIA DEL GIOCATORE 2!";
      }
      document.getElementById('match-winner-title').innerText = winnerTitle;
      document.getElementById('match-details-text').innerText = `Partita intensa decisa sul campo da calcetto 5v5!`;
    }

    // GESTIONE ONLINE (BASE FIREBASE)
    function createRoom() {
      let code = Math.random().toString(36).substring(2, 6).toUpperCase();
      gameState.roomCode = code;
      alert("Stanza creata con codice: " + code + ". Condividilo con l'amico!");
      startLocalGame(); // Per ora simula in locale in attesa della sincronizzazione completa
    }

    function joinRoom() {
      let code = document.getElementById('room-code-input').value.toUpperCase();
      if (code.length < 4) {
        alert("Inserisci un codice valido a 4 lettere!");
        return;
      }
      gameState.roomCode = code;
      alert("Connessione alla stanza " + code + "...");
      startLocalGame();
    }
  </script>
</body>
</html>
